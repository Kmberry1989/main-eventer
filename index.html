<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Main Eventer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #faf6f1;
        --surface: #ffffff;
        --surface-2: #f3ece3;
        --ink: #2b2118;
        --ink-soft: #5d4f42;
        --line: #ddd0c0;
        --accent: #a44a24;
        --accent-ink: #ffffff;
        --good: #2e6b34;
        --good-bg: #e2efe1;
        --bad: #a12622;
        --bad-bg: #f9e3e1;
        --warn: #8a6414;
        --warn-bg: #f7ecd2;
        --chip: #efe7db;
        --shadow: 0 1px 2px rgba(60, 38, 20, .06), 0 8px 24px rgba(60, 38, 20, .06);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d1712;
          --surface: #2a211a;
          --surface-2: #332820;
          --ink: #f2e9df;
          --ink-soft: #c4b3a1;
          --line: #4a3a2d;
          --accent: #e07a45;
          --accent-ink: #241407;
          --good: #9ed3a2;
          --good-bg: #243d27;
          --bad: #f2a49f;
          --bad-bg: #472320;
          --warn: #eacd8a;
          --warn-bg: #453a1c;
          --chip: #3a2d21;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
        }
      }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Public Sans", system-ui, -apple-system, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-touch-callout: none;
      }
      h1, h2, h3, p { margin: 0; }
      button, input, select, textarea { font: inherit; color: inherit; }
      input, textarea, select { user-select: text; -webkit-user-select: text; }
      .nonsel { user-select: none; -webkit-user-select: none; }

      .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 18px 64px; }

      header.page { margin-bottom: 26px; }
      header.page h1 {
        font-family: "Lora", Georgia, serif;
        font-size: clamp(30px, 5vw, 42px);
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.12;
      }
      header.page p {
        margin-top: 8px;
        color: var(--ink-soft);
        max-width: 62ch;
        font-size: 17px;
      }

      .cols {
        display: grid;
        grid-template-columns: minmax(320px, 400px) 1fr;
        gap: 22px;
        align-items: start;
      }
      @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }
      .card + .card { margin-top: 22px; }
      .card h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 21px;
        font-weight: 600;
        line-height: 1.25;
      }
      .card .sub { color: var(--ink-soft); font-size: 14.5px; margin-top: 4px; }

      form.record { position: sticky; top: 18px; }
      @media (max-width: 860px) { form.record { position: static; } }
      .field { margin-top: 14px; }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-bottom: 5px;
      }
      .field input, .field textarea, .field select {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 16px;
      }
      .field textarea { min-height: 84px; resize: vertical; }
      .field input:focus, .field textarea:focus, .field select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      .canon {
        margin-top: 18px;
        background: var(--surface-2);
        border-radius: 10px;
        padding: 13px 15px;
        font-size: 15px;
      }
      .canon .k {
        font-size: 12px; font-weight: 700; letter-spacing: .06em;
        text-transform: uppercase; color: var(--accent); margin-bottom: 3px;
      }
      .canon .v { font-weight: 600; }

      .out-head {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
      }
      .out-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
      @media (max-width: 640px) { .out-grid { grid-template-columns: 1fr; } }
      .out {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 14px 15px;
        background: var(--bg);
        display: flex; flex-direction: column;
      }
      .out h3 { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
      .out h3 .tag {
        font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
        background: var(--chip); color: var(--ink-soft);
        padding: 2px 8px; border-radius: 999px;
      }
      .out pre {
        margin: 10px 0 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
        font-size: 14.5px;
        line-height: 1.55;
        flex: 1;
      }
      .out pre.is-empty { color: var(--ink-soft); font-style: italic; }
      .out .actions { display: flex; gap: 8px; flex-wrap: wrap; }

      .btn {
        appearance: none;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 9px;
        padding: 8px 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .btn.ghost { background: transparent; color: var(--accent); }
      .btn.plain { background: var(--surface); border-color: var(--line); color: var(--ink); }
      .btn:active { transform: translateY(1px); }
      .btn[disabled] { opacity: .45; cursor: default; transform: none; }
      .btn.copied { background: var(--good); border-color: var(--good); color: #fff; }

      .check-controls { display: grid; grid-template-columns: 220px 1fr; gap: 12px; margin-top: 14px; }
      @media (max-width: 640px) { .check-controls { grid-template-columns: 1fr; } }
      #pasteText { width: 100%; box-sizing: border-box; min-height: 130px; resize: vertical;
        background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font-size: 15px; }
      #pasteText:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

      .verdict { margin-top: 16px; border-radius: 10px; padding: 13px 15px; font-weight: 600; display: none; }
      .verdict.show { display: block; }
      .verdict.ok { background: var(--good-bg); color: var(--good); }
      .verdict.no { background: var(--bad-bg); color: var(--bad); }
      .verdict.mid { background: var(--warn-bg); color: var(--warn); }

      .results { margin-top: 14px; display: none; }
      .results.show { display: block; }
      .rrow {
        display: grid; grid-template-columns: 110px 1fr auto; gap: 12px;
        padding: 11px 0; border-top: 1px solid var(--line); align-items: start;
      }
      .rrow .fname { font-weight: 700; font-size: 14.5px; padding-top: 2px; }
      .rrow .fdetail { font-size: 14.5px; color: var(--ink-soft); }
      .rrow .fdetail b { color: var(--ink); }
      .pill {
        font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
        padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      }
      .pill.match { background: var(--good-bg); color: var(--good); }
      .pill.conflict { background: var(--bad-bg); color: var(--bad); }
      .pill.missing { background: var(--warn-bg); color: var(--warn); }
      @media (max-width: 520px) {
        .rrow { grid-template-columns: 1fr auto; }
        .rrow .fdetail { grid-column: 1 / -1; order: 3; }
      }
      .note { margin-top: 14px; font-size: 13.5px; color: var(--ink-soft); }

      .me-auth { margin-bottom: 22px; }
      .me-auth-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .me-list { list-style: none; margin: 14px 0 0; padding: 0; }
      .me-list li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .me-saved { flex: 1; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; font-size: 15px; color: var(--ink); }
      .me-saved:hover { text-decoration: underline; }
      .me-empty { color: var(--ink-soft); font-size: 14.5px; }
      .me-del { padding: 6px 10px; font-size: 13px; }
      .field.flag label::after { content: " \26A0"; color: var(--warn); }
      .field.flag input, .field.flag textarea { border-color: var(--warn); }
      .fineprint { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 44px; }
      .fineprint a { color: inherit; }
      .tut-backdrop { position: fixed; inset: 0; background: rgba(20,12,6,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
      .tut-backdrop.show { display: flex; }
      .tut-card { background: var(--surface); color: var(--ink); border-radius: 14px; max-width: 420px; width: 100%; padding: 22px; box-shadow: var(--shadow); }
      .tut-card h2 { font-family: "Lora", Georgia, serif; font-size: 22px; margin-bottom: 10px; }
      .tut-card ol { margin: 0 0 16px; padding-left: 22px; line-height: 1.6; }
      .tut-card li + li { margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page nonsel">
        <h1>Main Eventer</h1>
      </header>

      <section class="card me-auth">
        <div class="me-auth-row">
          <p id="meAuthLabel" style="font-weight:600;"></p>
          <button class="btn" id="meAuthBtn" type="button">Sign in with Google</button>
        </div>
        <p class="note" id="meStatus"></p>
      </section>

      <div class="cols">
        <div>
        <form class="card record" id="recordForm" autocomplete="off">
          <h2>Event</h2>

          <div class="field">
            <label for="fTitle">Event name</label>
            <input id="fTitle" type="text" />
          </div>
          <div class="field">
            <label for="fHost">Host</label>
            <input id="fHost" type="text" />
          </div>
          <div class="field">
            <label for="fDate">Date</label>
            <input id="fDate" type="date" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="fStart">Start time</label>
              <input id="fStart" type="time" />
            </div>
            <div class="field">
              <label for="fEnd">End time</label>
              <input id="fEnd" type="time" />
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="fPrice">Price</label>
              <input id="fPrice" type="text" />
            </div>
            <div class="field">
              <label for="fAges">Ages</label>
              <input id="fAges" type="text" />
            </div>
          </div>
          <div class="field">
            <label for="fLocation">Location</label>
            <input id="fLocation" type="text" />
          </div>
          <div class="field">
            <label for="fDesc">Description</label>
            <textarea id="fDesc"></textarea>
          </div>
          <div class="field">
            <label for="fLink">Link</label>
            <input id="fLink" type="url" inputmode="url" />
          </div>

          <div class="canon nonsel">
            <div class="k">Canonical line</div>
            <div class="v" id="canonLine"></div>
          </div>
        </form>
        <section class="card" id="savedCard">
          <h2>Saved events</h2>
          <ul class="me-list" id="meSavedList"><li class="me-empty">Sign in to see saved events.</li></ul>
          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn" id="meSaveBtn" type="button">Save event</button>
            <button class="btn plain" id="meNewBtn" type="button">New event</button>
          </div>
        </section>
        </div>

        <div>
          <section class="card">
            <div class="out-head">
              <div>
                <h2>Outputs</h2>
              </div>
              <button class="btn ghost" id="csvBtn" type="button">Download CSV</button>
            </div>
            <div class="out-grid" id="outGrid"></div>
          </section>

          <section class="card" id="googleCard">
            <h2>Google</h2>
            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn" id="meGoogleBtn" type="button">Push to Google</button>
            </div>
          </section>

          <section class="card">
            <h2>Check a post</h2>
            <div class="check-controls">
              <div class="field" style="margin-top:0">
                <label for="channelSel">Where this text lives</label>
                <select id="channelSel">
                  <option>Website</option>
                  <option>Facebook</option>
                  <option>Instagram</option>
                  <option>Threads</option>
                  <option>TikTok</option>
                  <option>Pinterest</option>
                  <option>Flyer / graphic</option>
                  <option>Google Calendar</option>
                  <option>Other listing</option>
                </select>
              </div>
              <div class="field" style="margin-top:0">
                <label for="pasteText">Pasted text</label>
                <textarea id="pasteText"></textarea>
              </div>
            </div>
            <div style="margin-top:14px">
              <button class="btn" id="checkBtn" type="button">Check it</button>
            </div>
            <div class="verdict" id="verdict"></div>
            <div class="results" id="results"></div>
          </section>
        </div>
      </div>
      <footer class="fineprint nonsel"><a href="manual.html">Help</a></footer>
    </div>

    <div class="tut-backdrop" id="tutBackdrop">
      <div class="tut-card" role="dialog" aria-label="Main Eventer tutorial">
        <h2>Main Eventer</h2>
        <ol>
          <li>Enter the event once.</li>
          <li>Copy the matching posts and calendar event.</li>
          <li>Check live posts against the record.</li>
        </ol>
        <button class="btn" id="tutClose" type="button">Close</button>
      </div>
    </div>

    <script>
      "use strict";
      var $ = function (id) { return document.getElementById(id); };
      var FIELDS = ["fTitle", "fDate", "fStart", "fEnd", "fPrice", "fAges", "fHost", "fLocation", "fDesc", "fLink"];

      var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      var MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var DAYS_S = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

      function pad(n) { return (n < 10 ? "0" : "") + n; }

      function parseDateVal(v) {
        if (!v) return null;
        var p = v.split("-");
        if (p.length !== 3) return null;
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        return isNaN(d.getTime()) ? null : d;
      }
      function parseTimeVal(v) {
        if (!v) return null;
        var p = v.split(":");
        return (+p[0]) * 60 + (+p[1]);
      }
      function fmtTime(mins) {
        if (mins == null) return "";
        var h = Math.floor(mins / 60), m = mins % 60;
        var ap = h >= 12 ? "PM" : "AM";
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        return h12 + ":" + pad(m) + " " + ap;
      }
      function fmtTimeShort(mins) {
        if (mins == null) return "";
        var h = Math.floor(mins / 60), m = mins % 60;
        var ap = h >= 12 ? "PM" : "AM";
        var h12 = h % 12; if (h12 === 0) h12 = 12;
        return m === 0 ? h12 + " " + ap : h12 + ":" + pad(m) + " " + ap;
      }
      function fmtDateLong(d) {
        return DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
      }
      function fmtDateShort(d) {
        return DAYS_S[d.getDay()] + ", " + MONTHS_S[d.getMonth()] + " " + d.getDate();
      }

      function getRecord() {
        var r = {};
        FIELDS.forEach(function (f) { r[f] = $(f).value.trim(); });
        r.dateObj = parseDateVal(r.fDate);
        r.startMin = parseTimeVal(r.fStart);
        r.endMin = parseTimeVal(r.fEnd);
        r.hasAny = FIELDS.some(function (f) { return !!r[f]; });
        return r;
      }

      function timeRange(r, short) {
        var f = short ? fmtTimeShort : fmtTime;
        if (r.startMin == null) return "";
        var s = f(r.startMin);
        return r.endMin != null ? s + " \u2013 " + f(r.endMin) : s;
      }
      function detailLines(r) {
        var lines = [];
        if (r.dateObj) lines.push(fmtDateLong(r.dateObj) + (r.startMin != null ? " \u00B7 " + timeRange(r) : ""));
        if (r.fHost) lines.push("Host: " + r.fHost);
        if (r.fPrice) lines.push("Price: " + r.fPrice);
        if (r.fAges) lines.push("Ages: " + r.fAges);
        if (r.fLocation) lines.push(r.fLocation);
        return lines;
      }
      function joinParts() {
        var parts = [];
        for (var i = 0; i < arguments.length; i++) if (arguments[i]) parts.push(arguments[i]);
        return parts.join("\n");
      }

      var CHANNELS = [
        { id: "gcal", name: "Google Calendar", tag: "Calendar", build: function (r) {
            var lines = [];
            if (r.fDesc) lines.push(r.fDesc);
            var d = detailLines(r); d.shift();
            lines = lines.concat(d);
            if (r.fLink) lines.push("Details & registration: " + r.fLink);
            return lines.join("\n");
          }, extra: "gcal" },
        { id: "website", name: "Website listing", tag: "Website", build: function (r) {
            return joinParts(r.fTitle, detailLines(r).join("\n"), r.fDesc, r.fLink ? "Reserve your spot: " + r.fLink : "");
          } },
        { id: "facebook", name: "Facebook post", tag: "Social", build: function (r) {
            var head = r.fTitle + (r.dateObj ? " \u2014 " + fmtDateShort(r.dateObj) + (r.startMin != null ? ", " + timeRange(r, true) : "") : "");
            return joinParts(head, r.fDesc, detailLines(r).slice(1).join("\n"), r.fLink ? "Save your seat: " + r.fLink : "");
          } },
        { id: "instagram", name: "Instagram caption", tag: "Social", build: function (r) {
            var head = r.fTitle + (r.dateObj ? " \u2022 " + fmtDateShort(r.dateObj) + (r.startMin != null ? " \u2022 " + timeRange(r, true) : "") : "");
            var tags = "#FiredArtsStudio #KokomoIN #PaintYourOwnPottery";
            return joinParts(head, r.fDesc, detailLines(r).slice(1).join("\n"), r.fLink ? "Link in bio to register" : "", tags);
          } },
        { id: "threads", name: "Threads post", tag: "Social", build: function (r) {
            var bits = [];
            if (r.fTitle) bits.push(r.fTitle);
            if (r.dateObj) bits.push(fmtDateShort(r.dateObj) + (r.startMin != null ? ", " + timeRange(r, true) : ""));
            if (r.fPrice) bits.push(r.fPrice);
            if (r.fAges) bits.push("Ages " + r.fAges.replace(/^ages\s*/i, ""));
            if (r.fHost) bits.push("Host " + r.fHost);
            var s = bits.join(" \u00B7 ");
            if (r.fLink) s += (s ? "\n" : "") + r.fLink;
            return s;
          } },
        { id: "tiktok", name: "TikTok caption", tag: "Social", build: function (r) {
            var bits = [];
            if (r.fTitle) bits.push(r.fTitle);
            if (r.dateObj) bits.push(fmtDateShort(r.dateObj) + (r.startMin != null ? " at " + timeRange(r, true) : ""));
            if (r.fLocation) bits.push("at " + r.fLocation);
            if (r.fHost) bits.push("Hosted by " + r.fHost);
            var s = bits.join(" ");
            if (r.fLink) s += (s ? "\n" : "") + "Register: " + r.fLink;
            if (s) s += "\n#FiredArtsStudio #KokomoIN #PYOP";
            return s;
          } },
        { id: "pinterest", name: "Pinterest description", tag: "Social", build: function (r) {
            return joinParts(r.fTitle + (r.dateObj ? " | " + fmtDateLong(r.dateObj) : ""), r.fDesc, detailLines(r).slice(1).join("\n"), r.fLink);
          } },
        { id: "flyer", name: "Flyer text", tag: "Graphic", build: function (r) {
            var lines = [];
            if (r.fTitle) lines.push(r.fTitle.toUpperCase());
            if (r.dateObj) lines.push(fmtDateLong(r.dateObj));
            if (r.startMin != null) lines.push(timeRange(r));
            if (r.fPrice) lines.push(r.fPrice);
            if (r.fAges) lines.push("Ages " + r.fAges.replace(/^ages\s*/i, ""));
            if (r.fHost) lines.push("Host: " + r.fHost);
            if (r.fLocation) lines.push(r.fLocation);
            if (r.fLink) lines.push(r.fLink);
            return lines.join("\n");
          } }
      ];

      var outGrid = $("outGrid");
      var preById = {};
      CHANNELS.forEach(function (ch) {
        var div = document.createElement("div");
        div.className = "out nonsel";
        var h = document.createElement("h3");
        h.textContent = ch.name;
        var tag = document.createElement("span");
        tag.className = "tag"; tag.textContent = ch.tag;
        h.appendChild(tag);
        var pre = document.createElement("pre");
        pre.id = "pre-" + ch.id;
        var actions = document.createElement("div");
        actions.className = "actions";
        var copyBtn = document.createElement("button");
        copyBtn.className = "btn"; copyBtn.type = "button"; copyBtn.textContent = "Copy";
        copyBtn.addEventListener("click", function () { copyText(pre.textContent, copyBtn); });
        actions.appendChild(copyBtn);
        if (ch.extra === "gcal") {
          var link = document.createElement("a");

          link.textContent = "Open in Google Calendar";

        div.appendChild(h); div.appendChild(pre); div.appendChild(actions);

      });

      function copyText(text, btn) {
        function done() {
          var old = btn.textContent;
          btn.textContent = "Copied"; btn.classList.add("copied");
          setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1600);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallback(); });
        } else { fallback(); }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      }

      function icsStamp(d, mins) {
        return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "T" + pad(Math.floor(mins / 60)) + pad(mins % 60) + "00";
      }
      function downloadIcs() {
        var r = getRecord();
        if (!(r.fTitle && r.dateObj && r.startMin != null)) return;
        var endMin = r.endMin != null ? r.endMin : r.startMin + 60;
        var desc = (preById.gcal.textContent || "").replace(/\n/g, "\\n");
        var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Main Eventer//EN", "BEGIN:VEVENT",
          "UID:" + Date.now() + "@main-eventer",
          "DTSTART;TZID=America/Indiana/Indianapolis:" + icsStamp(r.dateObj, r.startMin),
          "DTEND;TZID=America/Indiana/Indianapolis:" + icsStamp(r.dateObj, endMin),
          "SUMMARY:" + r.fTitle,
          r.fLocation ? "LOCATION:" + r.fLocation : "",
          "DESCRIPTION:" + desc,
          "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
        var blob = new Blob([ics], { type: "text/calendar" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = r.fTitle.replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() + ".ics";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      }

      function csvCell(s) { return '"' + String(s || "").replace(/"/g, '""') + '"'; }
      $("csvBtn").addEventListener("click", function () {
        var r = getRecord();
        var head = ["title","date","weekday","start_time","end_time","price","ages","host","location","description","link"];
        var row = [r.fTitle,
          r.dateObj ? MONTHS[r.dateObj.getMonth()] + " " + r.dateObj.getDate() + ", " + r.dateObj.getFullYear() : "",
          r.dateObj ? DAYS[r.dateObj.getDay()] : "",
          r.startMin != null ? fmtTime(r.startMin) : "",
          r.endMin != null ? fmtTime(r.endMin) : "",
          r.fPrice, r.fAges, r.fHost, r.fLocation, r.fDesc, r.fLink];
        var csv = head.join(",") + "\n" + row.map(csvCell).join(",");
        var blob = new Blob([csv], { type: "text/csv" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "event-record.csv";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      });

      function render() {
        var r = getRecord();
        var canon = $("canonLine");
        if (r.hasAny) {
          var cparts = [];
          if (r.fTitle) cparts.push(r.fTitle);
          if (r.dateObj) cparts.push(fmtDateLong(r.dateObj));
          if (r.startMin != null) cparts.push(timeRange(r));
          if (r.fHost) cparts.push("Host: " + r.fHost);
          if (r.fPrice) cparts.push(r.fPrice);
          if (r.fAges) cparts.push("Ages " + r.fAges.replace(/^ages\s*/i, ""));
          if (r.fLocation) cparts.push(r.fLocation);
          canon.textContent = cparts.join(" \u00B7 ");
        } else {
          canon.textContent = "";
        }
        CHANNELS.forEach(function (ch) {
          var pre = preById[ch.id];
          pre.textContent = r.hasAny ? ch.build(r) : "";
          pre.classList.toggle("is-empty", !r.hasAny);
        });
        var link = $("gcalLink");
        if (link) {
          if (r.fTitle && r.dateObj && r.startMin != null) {
            var endMin = r.endMin != null ? r.endMin : r.startMin + 60;
            var dates = icsStamp(r.dateObj, r.startMin) + "/" + icsStamp(r.dateObj, endMin);
            var url = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
              "&text=" + encodeURIComponent(r.fTitle) +
              "&dates=" + dates +
              "&ctz=America/Indiana/Indianapolis" +
              "&details=" + encodeURIComponent(preById.gcal.textContent || "") +
              (r.fLocation ? "&location=" + encodeURIComponent(r.fLocation) : "");
            link.href = url; link.removeAttribute("disabled");
          } else {
            link.removeAttribute("href");
          }
        }
        ["fTitle", "fDate", "fStart", "fEnd", "fPrice", "fAges"].forEach(function (id) {
          var el = $(id);
          if (el) {
            var w = el.closest(".field");
            if (w) w.classList.toggle("flag", !el.value.trim());
          }
        });
      }
      FIELDS.forEach(function (f) {
        $(f).addEventListener("input", render);
        $(f).addEventListener("change", render);
      });
      $("recordForm").addEventListener("submit", function (e) { e.preventDefault(); });
      render();

      /* ---------- checker ---------- */
      var MONTH_LOOKUP = {};
      MONTHS.forEach(function (m, i) { MONTH_LOOKUP[m.toLowerCase()] = i; MONTH_LOOKUP[MONTHS_S[i].toLowerCase()] = i; });
      MONTH_LOOKUP["sept"] = 8;
      var DAY_LOOKUP = {};
      DAYS.forEach(function (d, i) { DAY_LOOKUP[d.toLowerCase()] = i; DAY_LOOKUP[DAYS_S[i].toLowerCase()] = i; });

      function extractTimes(text) {
        var found = [], m;
        var re = /(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/gi;
        while ((m = re.exec(text)) !== null) {
          var h = +m[1] % 12;
          if (/p/i.test(m[3])) h += 12;
          found.push(h * 60 + (m[2] ? +m[2] : 0));
        }
        if (/\bnoon\b/i.test(text)) found.push(720);
        if (/\bmidnight\b/i.test(text)) found.push(0);
        return found;
      }
      function extractDates(text) {
        var found = [], m;
        var re1 = /\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b/gi;
        while ((m = re1.exec(text)) !== null) found.push({ month: MONTH_LOOKUP[m[1].toLowerCase()], day: +m[2] });
        var re2 = /\b(\d{1,2})\/(\d{1,2})(?:\/\d{2,4})?\b/g;
        while ((m = re2.exec(text)) !== null) {
          var mo = +m[1], da = +m[2];
          if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) found.push({ month: mo - 1, day: da });
        }
        return found;
      }
      function extractWeekdays(text) {
        var found = [], m;
        var re = /\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/gi;
        var extra = { tues: 2, thur: 4, thurs: 4 };
        while ((m = re.exec(text)) !== null) {
          var k = m[1].toLowerCase();
          found.push(DAY_LOOKUP[k] != null ? DAY_LOOKUP[k] : extra[k]);
        }
        return found;
      }
      function extractPrices(text) {
        var found = [], m;
        var re = /\$\s?(\d+(?:\.\d{1,2})?)/g;
        while ((m = re.exec(text)) !== null) found.push(parseFloat(m[1]));
        return found;
      }
      function extractAges(text) {
        var found = [], m;
        var re = /ages?\s*(?:of\s*)?(\d{1,2})\s*(?:\u2013|\u2014|-|to|\+|and up|& up)?\s*(\d{1,2})?/gi;
        while ((m = re.exec(text)) !== null) found.push({ raw: m[0], nums: [m[1], m[2]].filter(Boolean) });
        return found;
      }
      function extractHosts(text) {
        var found = [], m;
        var re = /\b[Hh]ost(?:ed by)?\s*:?\s+([A-Z][\w.'-]*(?:\s+[A-Z][\w.'-]+)?)/g;
        while ((m = re.exec(text)) !== null) found.push(m[1].replace(/[.,;:]$/, "").trim());
        return found;
      }
      function uniqNums(arr) {
        var seen = {}, out = [];
        arr.forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } });
        return out;
      }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function row(name, status, detailHtml) {
        var label = status === "match" ? "Match" : status === "conflict" ? "Conflict" : "Not stated";
        return '<div class="rrow"><div class="fname">' + esc(name) + '</div><div class="fdetail">' + detailHtml + '</div><span class="pill ' + status + '">' + label + "</span></div>";
      }

      $("checkBtn").addEventListener("click", function () {
        var r = getRecord();
        var verdict = $("verdict"), results = $("results");
        var channel = $("channelSel").value;
        var text = $("pasteText").value;
        results.classList.remove("show");
        if (!text.trim()) {
          verdict.className = "verdict show mid";
          verdict.textContent = "Paste text first, then check.";
          return;
        }
        var rows = [], conflicts = 0, matches = 0, missing = 0;
        function tally(st) { if (st === "conflict") conflicts++; else if (st === "match") matches++; else missing++; }

        // Date
        var dates = extractDates(text);
        var dateSt, dateDet;
        if (!r.dateObj) {
          dateSt = "missing";
          dateDet = "The record leaves the date blank.";
        } else if (!dates.length) {
          dateSt = "missing";
          dateDet = "The record says <b>" + esc(fmtDateLong(r.dateObj)) + "</b>. The pasted text states no date.";
        } else {
          var okD = dates.some(function (d) { return d.month === r.dateObj.getMonth() && d.day === r.dateObj.getDate(); });
          var shown = dates.map(function (d) { return MONTHS_S[d.month] + " " + d.day; }).join(", ");
          if (okD) { dateSt = "match"; dateDet = "Record: <b>" + esc(fmtDateLong(r.dateObj)) + "</b>. Text states: <b>" + esc(shown) + "</b>."; }
          else { dateSt = "conflict"; dateDet = "Record: <b>" + esc(fmtDateLong(r.dateObj)) + "</b>. Text states: <b>" + esc(shown) + "</b>."; }
        }
        rows.push(row("Date", dateSt, dateDet)); tally(dateSt);

        // Weekday
        var wds = uniqNums(extractWeekdays(text));
        var wdSt, wdDet;
        if (!r.dateObj) {
          wdSt = "missing";
          wdDet = "The record leaves the date blank.";
        } else if (!wds.length) {
          wdSt = "missing";
          wdDet = "The record falls on a <b>" + esc(DAYS[r.dateObj.getDay()]) + "</b>. The pasted text names no day of the week.";
        } else {
          var names = wds.map(function (i) { return DAYS[i]; }).join(", ");
          if (wds.indexOf(r.dateObj.getDay()) >= 0) { wdSt = "match"; wdDet = "Record: <b>" + esc(DAYS[r.dateObj.getDay()]) + "</b>. Text says: <b>" + esc(names) + "</b>."; }
          else { wdSt = "conflict"; wdDet = "Record: <b>" + esc(DAYS[r.dateObj.getDay()]) + "</b>. Text says: <b>" + esc(names) + "</b>."; }
        }
        rows.push(row("Day of week", wdSt, wdDet)); tally(wdSt);

        // Times
        var times = uniqNums(extractTimes(text));
        var rangeTxt = timeRange(r);
        var tSt, tDet;
        if (r.startMin == null) {
          tSt = "missing";
          tDet = "The record leaves the time blank.";
        } else if (!times.length) {
          tSt = "missing";
          tDet = "The record runs <b>" + esc(rangeTxt) + "</b>. The pasted text states no time.";
        } else {
          var canonTimes = [r.startMin]; if (r.endMin != null) canonTimes.push(r.endMin);
          var bad = times.filter(function (t) { return canonTimes.indexOf(t) < 0; });
          var shownT = times.map(fmtTime).join(", ");
          if (!bad.length) { tSt = "match"; tDet = "Record: <b>" + esc(rangeTxt) + "</b>. Text states: <b>" + esc(shownT) + "</b>."; }
          else { tSt = "conflict"; tDet = "Record: <b>" + esc(rangeTxt) + "</b>. Text states: <b>" + esc(shownT) + "</b> \u2014 " + esc(bad.map(fmtTime).join(", ")) + " does not match the record."; }
        }
        rows.push(row("Times", tSt, tDet)); tally(tSt);

        // Price
        if (r.fPrice) {
          var canonNums = (r.fPrice.match(/\d+(?:\.\d{1,2})?/g) || []).map(parseFloat);
          var canonFree = /\bfree\b/i.test(r.fPrice);
          var foundNums = extractPrices(text);
          var textFree = /\bfree\b/i.test(text);
          var pSt, pDet;
          if (!foundNums.length && !textFree) {
            pSt = "missing";
            pDet = "The record lists <b>" + esc(r.fPrice) + "</b>. The pasted text states no price.";
          } else if (canonFree) {
            if (textFree) { pSt = "match"; pDet = "Record: <b>" + esc(r.fPrice) + "</b>. Text also says free."; }
            else { pSt = "conflict"; pDet = "Record: <b>" + esc(r.fPrice) + "</b>. Text states: <b>$" + foundNums.join(", $") + "</b>."; }
          } else {
            var badP = foundNums.filter(function (n) { return canonNums.indexOf(n) < 0; });
            if (foundNums.length && !badP.length) { pSt = "match"; pDet = "Record: <b>" + esc(r.fPrice) + "</b>. Text states: <b>$" + foundNums.join(", $") + "</b>."; }
            else if (!foundNums.length && textFree) { pSt = "conflict"; pDet = "Record: <b>" + esc(r.fPrice) + "</b>. Text says <b>free</b>."; }
            else { pSt = "conflict"; pDet = "Record: <b>" + esc(r.fPrice) + "</b>. Text states: <b>$" + foundNums.join(", $") + "</b>."; }
          }
          rows.push(row("Price", pSt, pDet)); tally(pSt);
        }

        // Ages
        if (r.fAges) {
          var canonAgeNums = (r.fAges.match(/\d{1,2}/g) || []);
          var foundAges = extractAges(text);
          var aSt, aDet;
          if (!foundAges.length) {
            aSt = "missing";
            aDet = "The record lists ages <b>" + esc(r.fAges) + "</b>. The pasted text states no ages.";
          } else {
            var allNums = [];
            foundAges.forEach(function (a) { allNums = allNums.concat(a.nums); });
            var badA = allNums.filter(function (n) { return canonAgeNums.indexOf(n) < 0; });
            var shownA = foundAges.map(function (a) { return a.raw.trim(); }).join("; ");
            if (!badA.length) { aSt = "match"; aDet = "Record: <b>" + esc(r.fAges) + "</b>. Text states: <b>" + esc(shownA) + "</b>."; }
            else { aSt = "conflict"; aDet = "Record: <b>" + esc(r.fAges) + "</b>. Text states: <b>" + esc(shownA) + "</b>."; }
          }
          rows.push(row("Ages", aSt, aDet)); tally(aSt);
        }

        // Host
        if (r.fHost) {
          var foundHosts = extractHosts(text);
          var hSt, hDet;
          if (!foundHosts.length) {
            hSt = "missing";
            hDet = "The record lists host <b>" + esc(r.fHost) + "</b>. The pasted text names no host.";
          } else {
            var hLower = r.fHost.toLowerCase();
            var hOk = foundHosts.some(function (h) {
              var a = h.toLowerCase();
              return a === hLower || a.indexOf(hLower) === 0 || hLower.indexOf(a) === 0;
            });
            var shownH = foundHosts.join(", ");
            if (hOk) { hSt = "match"; hDet = "Record: <b>" + esc(r.fHost) + "</b>. Text names: <b>" + esc(shownH) + "</b>."; }
            else { hSt = "conflict"; hDet = "Record: <b>" + esc(r.fHost) + "</b>. Text names: <b>" + esc(shownH) + "</b>."; }
          }
          rows.push(row("Host", hSt, hDet)); tally(hSt);
        }

        results.innerHTML = rows.join("");
        results.classList.add("show");
        if (conflicts > 0) {
          verdict.className = "verdict show no";
          verdict.textContent = conflicts + (conflicts === 1 ? " conflict" : " conflicts") + " with the record.";
        } else if (missing > 0) {
          verdict.className = "verdict show mid";
          verdict.textContent = "No conflicts \u2014 " + matches + (matches === 1 ? " field matches" : " fields match") + ", " + missing + " not stated.";
        } else {
          verdict.className = "verdict show ok";
          verdict.textContent = "Uniform.";
        }
      });

    <script>
/* ---------- Main Eventer: Firebase save/load + Google push ---------- */
(function () {

  // Public Firebase web config (same project as Arts Fired). The apiKey here
  // is a public client identifier, not a secret.
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDcw3y_l_xxvsuoPrEJRQGSLua7CPsoQYo",

    storageBucket: "fired-arts-dashboard.firebasestorage.app",

  var APPS_SCRIPT_URL = "";
  // Optional shared secret. If set, it must match SECRET_KEY in Code.gs.

  var APPS_SCRIPT_KEY = "";

  var ALLOWLIST = ["kylematthewberry@gmail.com", "rochelleberry731@gmail.com"];
  var COLLECTION = "mainEvent_events";

  var auth = null, db = null, currentUser = null, loadedDocId = null;
  var $ = function (id) { return document.getElementById(id); };

  function status(msg) { var el = $("meStatus"); if (el) el.textContent = msg; }

      updateAuthUI();

  }

  function updateAuthUI() {
    var btn = $("meAuthBtn"), label = $("meAuthLabel");

    if (currentUser) {
      label.textContent = "Signed in as " + currentUser.email;
      btn.textContent = "Sign out";

      label.textContent = "";
      btn.textContent = "Sign in with Google";

  function signInOut() {
    if (!auth) { status("Firebase did not load. Check the connection and reload."); return; }
    if (currentUser) { auth.signOut(); return; }
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(function (result) {
      var email = (result.user.email || "").toLowerCase();
      if (ALLOWLIST.indexOf(email) < 0) {
        auth.signOut();
        status("That Google account is not on the studio list. Use the studio account.");

      status("Sign-in failed. " + (err && err.message ? err.message : ""));

  function recordFromForm() {
    var r = getRecord();
    return {
      title: r.fTitle, date: r.fDate, startTime: r.fStart, endTime: r.fEnd,
      price: r.fPrice, ages: r.fAges, host: r.fHost, location: r.fLocation,
      description: r.fDesc, link: r.fLink
    };
  }

  function formFromRecord(d) {
    $("fTitle").value = d.title || "";
    $("fDate").value = d.date || "";
    $("fStart").value = d.startTime || "";
    $("fEnd").value = d.endTime || "";
    $("fPrice").value = d.price || "";
    $("fAges").value = d.ages || "";
    $("fHost").value = d.host || "";
    $("fLocation").value = d.location || "";
    $("fDesc").value = d.description || "";
    $("fLink").value = d.link || "";
    render();
  }

  function clearForm() {
    loadedDocId = null;
    formFromRecord({});
    status("");
  }

  function saveEvent() {
    if (!currentUser) { status("Sign in first to save."); return; }
    var r = getRecord();
    if (!r.hasAny) { status("Nothing to save."); return; }
    var data = recordFromForm();
    data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    data.createdBy = currentUser.email;
    function done() { status("Saved."); loadSavedList(); }
    function fail(e) { status("Save failed. " + (e && e.message ? e.message : "")); }
    if (loadedDocId) {
      db.collection(COLLECTION).doc(loadedDocId).set(data, { merge: true }).then(done, fail);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      db.collection(COLLECTION).add(data).then(function (ref) { loadedDocId = ref.id; done(); }, fail);
    }
  }

  function loadSavedList() {
    var list = $("meSavedList");
    if (!list) return;
    if (!currentUser) { list.innerHTML = '<li class="me-empty">Sign in to see saved events.</li>'; return; }
    db.collection(COLLECTION).orderBy("updatedAt", "desc").limit(50).get().then(function (snap) {
      list.innerHTML = "";
      if (snap.empty) { list.innerHTML = '<li class="me-empty">No saved events yet.</li>'; return; }

        var d = doc.data();

        b.addEventListener("click", function () { loadedDocId = doc.id; formFromRecord(d); status("Loaded."); });
        var del = document.createElement("button");
        del.type = "button"; del.className = "btn plain me-del"; del.textContent = "Delete";
        del.addEventListener("click", function (ev) {

            if (loadedDocId === doc.id) loadedDocId = null;
            status("Deleted."); loadSavedList();
          }, function (e) { status("Delete failed. " + (e && e.message ? e.message : "")); });
        });
        li.appendChild(b); li.appendChild(del);
        list.appendChild(li);
      });
    }, function () { list.innerHTML = '<li class="me-empty">Could not load saved events.</li>'; });
  }

  function pushToGoogle() {
    var r = getRecord();
    if (!(r.fTitle && r.dateObj && r.startMin != null)) { status("Add a name, date, and start time to push to Google."); return; }
    if (!APPS_SCRIPT_URL) { status("Google push needs the Apps Script web app URL. See README."); return; }
    var fbPre = $("pre-facebook"), thPre = $("pre-threads"), gcalPre = $("pre-gcal");
    var payload = {
      key: APPS_SCRIPT_KEY || "",
      title: r.fTitle,
      date: r.fDate,
      startTime: r.fStart,
      endTime: r.fEnd,
      price: r.fPrice,
      ages: r.fAges,
      host: r.fHost,
      location: r.fLocation,
      description: r.fDesc,
      link: r.fLink,
      facebookText: fbPre ? fbPre.textContent : "",
      threadsText: thPre ? thPre.textContent : "",
      calendarDescription: gcalPre ? gcalPre.textContent : ""
    };
    // text/plain (not application/json) so the browser sends no CORS
    // preflight, which Apps Script web apps do not answer. The body is
    // still a JSON string; Code.gs parses it.
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (data && data.ok) { status("Pushed to Google."); }
      else { status("Google push failed." + (data && data.error ? " " + data.error : "")); }
    }).catch(function () { status("Google push failed."); });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var authBtn = $("meAuthBtn");
    if (authBtn) authBtn.addEventListener("click", signInOut);
    var saveBtn = $("meSaveBtn");
    if (saveBtn) saveBtn.addEventListener("click", saveEvent);
    var newBtn = $("meNewBtn");
    if (newBtn) newBtn.addEventListener("click", clearForm);
    var googleBtn = $("meGoogleBtn");
    if (googleBtn) googleBtn.addEventListener("click", pushToGoogle);
    var tut = $("tutBackdrop");
    if (tut) {
      var seenTut = false;
      try { seenTut = !!localStorage.getItem("me_tutorial_seen"); } catch (e) {}
      if (!seenTut) tut.classList.add("show");
      var hideTut = function () {
        tut.classList.remove("show");
        try { localStorage.setItem("me_tutorial_seen", "1"); } catch (e) {}
      };
      var tutClose = $("tutClose");
      if (tutClose) tutClose.addEventListener("click", hideTut);
      tut.addEventListener("click", function (e) { if (e.target === tut) hideTut(); });
    }
    initFirebase();
  });
})();

    </script>
